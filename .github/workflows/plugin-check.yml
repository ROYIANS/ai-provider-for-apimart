name: Plugin Check
permissions: {}
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'codex/**'
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: true
jobs:
  plugin-check:
    name: WordPress Plugin Check (PHP 8.4)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Stage WordPress distribution
        env:
          PLUGIN_BUILD_DIR: ${{ runner.temp }}/ai-provider-for-apimart
        run: |
          mkdir -p "$PLUGIN_BUILD_DIR"
          rsync -a --exclude-from=.distignore ./ "$PLUGIN_BUILD_DIR/"
          for excluded in tests vendor .github .git .idea docs examples scripts tooling dist composer.json composer.lock phpcs.xml.dist phpunit.xml.dist phpstan.neon.dist README.md; do
            test ! -e "$PLUGIN_BUILD_DIR/$excluded"
          done
          test -f "$PLUGIN_BUILD_DIR/plugin.php"
          test -f "$PLUGIN_BUILD_DIR/readme.txt"
          test -f "$PLUGIN_BUILD_DIR/assets/images/apimart.svg"
      - name: Configure reproducible Plugin Check environment
        run: |
          # wp-env merges this after the configuration generated by the action.
          # Keep this file outside the staged distribution checked below.
          cat > .wp-env.override.json <<'JSON'
          {
            "core": "https://wordpress.org/wordpress-7.1.3.zip",
            "phpVersion": "8.4",
            "plugins": ["https://downloads.wordpress.org/plugin/plugin-check.2.1.0.zip"]
          }
          JSON
      - name: Run all default Plugin Check checks
        uses: WordPress/plugin-check-action@10857da14b6c2246d15402b3e69f777edcf8c12e # v1.1.9
        with:
          build-dir: ${{ runner.temp }}/ai-provider-for-apimart
          slug: ai-provider-for-apimart
          strict: true
      - name: Report WordPress and AI Client versions
        run: |
          wp-env run cli wp core version
          wp-env run cli wp eval 'echo "AI Client SDK: ", \WordPress\AiClient\AiClient::VERSION, PHP_EOL;'
